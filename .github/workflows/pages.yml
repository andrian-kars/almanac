name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits; one already running is never cut short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - id: pages
        uses: actions/configure-pages@v6

      # Pages serves the site from /<repository>/, not from the root.
      # No NASA key is given, so the live site uses NASA's shared DEMO_KEY.
      - run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/

      # Pages has no rewrites: an address with no file behind it, like /day/2024-05-01,
      # gets 404.html. Making that the app lets shared links and reloads work.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
