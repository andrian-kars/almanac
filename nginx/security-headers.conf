# Security headers, included in every location of default.conf (nginx drops inherited
# add_header lines in a block that adds its own). `always` sends them on error pages too.
#
# Content-Security-Policy: what the browser may load and where it may connect.
#   script-src   only the app's own files; no inline scripts, nothing from elsewhere.
#   style-src    'unsafe-inline' because MUI's styling engine (Emotion) writes <style> tags
#                as components render.
#   img-src      https: because pictures come from wherever the APIs link them
#                (Wikimedia, NASA, YouTube still frames); data: for the paper grain.
#   connect-src  exactly the APIs the app calls. src/securityHeaders.test.ts fails if the app
#                requests an address that is not listed here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://en.wikipedia.org https://archive-api.open-meteo.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.nasa.gov https://science.nasa.gov; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
