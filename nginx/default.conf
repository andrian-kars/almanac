# Serves the built app (dist/) as a single-page app: every page address returns index.html,
# and the app's router reads the address (e.g. /day/2024-05-01).
server {
    # The unprivileged image runs nginx as a regular user, which cannot use ports below 1024.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Both JavaScript types: nginx's mime.types has used each over the years.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Vite puts a hash of each file's content in its name (index-B0UXCfST.js), so a file
    # never changes under the same name and can be cached for a year. A missing one is a
    # 404, never index.html: the browser must not run a page as a script.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else: files from public/ as they are, and index.html for any page address.
    # Checked again on every visit, so a new release shows up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
