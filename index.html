<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almanac</title>
    <!-- Picks light or dark before the page is drawn; see public/color-scheme.js. -->
    <script src="/color-scheme.js"></script>
    <!-- The two backgrounds mirror src/theme.ts; src/colorSchemeScript.test.ts checks them. -->
    <style>
      html {
        color-scheme: light;
        background-color: #f4eee1;
      }
      html[data-color-scheme='dark'] {
        color-scheme: dark;
        background-color: #16130f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
